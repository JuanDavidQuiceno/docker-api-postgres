services:
  # Contenedor 2: base de datos MySQL
  db:
    build:
      context: ./db
    image: notes-db:1.0.0
    container_name: notes-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - notes_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Contenedor 1: API (se comunica con "db" por nombre de servicio)
  app:
    build:
      context: ./app
    image: notes-app:1.0.0
    container_name: notes-app
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT}
      DB_HOST: db            # nombre del servicio en la red de Docker
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - notes_net

networks:
  notes_net:
    name: notes_net
    driver: bridge

volumes:
  db_data:
    name: notes_db_data
