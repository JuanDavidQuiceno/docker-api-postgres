services:
  # Contenedor 2: base de datos PostgreSQL
  db:
    build:
      context: ./db
    image: notes-db:1.0.0
    container_name: notes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - notes_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Contenedor 1: API (se comunica con "db" por nombre de servicio)
  app:
    build:
      context: ./app
    image: notes-app:1.0.0
    container_name: notes-app
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT}
      DB_HOST: db            # nombre del servicio en la red de Docker
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - notes_net

networks:
  notes_net:
    name: notes_net
    driver: bridge

volumes:
  db_data:
    name: notes_db_data
